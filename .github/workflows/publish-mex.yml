name: Publish MEX binaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build MEX (macOS Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/*

      - name: Install MATLAB R2023b
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2023b

      - name: Configure CMake
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build MEX target
        run: cmake --build build --config Release --target nxr_compute_mex

      - name: List MEX output (sanity check)
        run: find build -name 'nxr_compute.mex*' -print

      - name: Upload MEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: mex-macos-arm64
          path: build/**/nxr_compute.mex*
          if-no-files-found: error
